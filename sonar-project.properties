sonar.projectKey=lukeboh_urna-velox-civica
sonar.organization=lukeboh
sonar.projectName=Urna Velox Civica

# Código avaliado: o motor, a aquisição (serviço, coletor, painel dos nós) e a página pública (site/).
sonar.sources=motor/src,aquisicao/src,site

# Fora da avaliação: código que só serve para teste e o que é gerado.
#  - **/testes.rs              módulos de teste do Rust (#[cfg(test)] mod testes;), um arquivo por módulo desde a 1.1.5 (CLAUDE.md, Convenções)
#  - aquisicao/src/bin/uv-carga.rs   cliente de carga e de conferência da difusão, só usado nos ensaios
#  - site/testes/**            testes da página (Playwright, Python) e as fixtures
#  - site/dist/**              pacote gerado pelo site/build.mjs a partir de site/src (seria duplicação)
#  - **/node_modules/**        dependências instaladas
#  - site/*.mjs, site/geo/**  ferramentas de linha de comando da página (build, documentos, capa, marca, mapa):
#                              rodam só na máquina de quem gera o site/dist, nunca no navegador nem no serviço
sonar.exclusions=**/testes.rs,aquisicao/src/bin/uv-carga.rs,site/testes/**,site/dist/**,**/node_modules/**,site/*.mjs,site/geo/**

# Cobertura: só o Rust gera relatório (cargo llvm-cov → lcov.info); a página não tem cobertura medida.
sonar.rust.lcov.reportPaths=lcov.info
sonar.coverage.exclusions=site/**
