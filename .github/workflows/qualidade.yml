name: Qualidade, Cobertura e SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, clippy

      - name: Cache de dependências Rust
        uses: Swatinem/rust-cache@v2

      - name: Instalar cargo-llvm-cov e cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-geiger

      - name: Clippy (Linter)
        run: cargo clippy --workspace --all-targets || true

      - name: Auditoria de Unsafe (Geiger)
        run: |
          echo "### 🛡️ Auditoria de Código Inseguro (Geiger)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo geiger -p urna-velox >> $GITHUB_STEP_SUMMARY || true
          cargo geiger -p uv-aquisicao >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Gerar Cobertura de Testes (LCOV e HTML)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          echo "### 📊 Resumo de Cobertura de Código" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov --workspace --summary-only >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov --workspace --html --output-dir relatorio-cobertura
          if [ -d "relatorio-cobertura/html" ]; then
            cp -r relatorio-cobertura/html/* relatorio-cobertura/
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do Artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: relatorio-cobertura

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: qualidade
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
