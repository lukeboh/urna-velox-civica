<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Archivo;src:url(../../../site/dist/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;font-family:Archivo,sans-serif;color:#eef1ff;
 background:radial-gradient(900px 500px at 15% 10%,#24306b 0%,transparent 60%),radial-gradient(700px 500px at 95% 100%,#3a1f5e 0%,transparent 60%),#0d1431}
.esq{position:absolute;left:84px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.logo{width:460px}
h1{font-size:40px;font-weight:700;line-height:1.15;font-stretch:105%}
h1 span{background:linear-gradient(90deg,#4fc3ff,#8c6bff 55%,#ff5fd2);-webkit-background-clip:text;color:transparent}
p{font-size:22px;line-height:1.4;color:#a8b2d8;font-weight:400}
.dir{position:absolute;right:0;top:0;bottom:0;width:640px}
.card{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.curva{right:250px;top:300px;width:420px}
.curva img,.cel img{display:block;width:100%}
.cel{right:150px;top:40px;width:262px;height:560px;border-radius:34px;border:6px solid #1c2450}
.cel img{height:100%;object-fit:cover;object-position:top}
</style></head><body>
<div class="esq">
 <img class="logo" src="../logotipo_horizontal_escuro.svg">
 <h1>Totalização eleitoral <span>independente</span>, BU por BU</h1>
 <p>Lê os Boletins de Urna públicos do TSE, totaliza em memória e mostra o resultado segundos depois de cada BU chegar — e confere com a divulgação oficial.</p>
</div>
<div class="dir">
  <div class="card cel"><img src="celular_capa.png"></div>
</div>
</body></html>
